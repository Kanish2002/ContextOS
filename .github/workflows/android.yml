name: Android APK (main only)

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: contextos-main-apk
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'

      - name: Reject bundled local models
        run: |
          python3 scripts/verify_model_free_apk.py --sources-only

      - name: Test and assemble model-free debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Verify APK does not include model weights
        run: |
          python3 scripts/verify_model_free_apk.py app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ContextOS-Debug-APK-main
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          compression-level: 6
          retention-days: 14
