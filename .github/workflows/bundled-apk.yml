name: Build APK with offline Qwen model

on:
  workflow_dispatch:
  push:
    branches:
      - feature/phase2-context-ux
  workflow_run:
    workflows: ['Android CI (source-only build)']
    types: [completed]

permissions:
  contents: read

jobs:
  bundled-apk:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Download bundled Apache 2.0 model
        run: |
          python3 -m pip install --quiet 'huggingface_hub[hf_xet]>=0.32,<2'
          mkdir -p app/src/main/assets/models
          hf download litert-community/Qwen3-0.6B-int4 \
            qwen3_0.6b_nothink_q4_block32_ekv1280.litertlm \
            --local-dir app/src/main/assets/models
      - name: Verify model SHA-256
        run: |
          echo '2df6821ec12702dafd33915e7a1a1adc7c4b053f3672fd9555dfaf3a114c4139  app/src/main/assets/models/qwen3_0.6b_nothink_q4_block32_ekv1280.litertlm' | sha256sum -c -
      - name: Compile, test and package full offline APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Verify the APK actually contains the model
        run: |
          python3 scripts/verify_bundled_apk.py app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ContextOS-Qwen3-Offline-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          compression-level: 0
          retention-days: 7
